<svg viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A cheerful child jumping up with one hand raised high, shouting Me with sparkles of excitement and a bold shout bubble" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="378" height="298" rx="20" fill="#FFF6E5" stroke="#DCE1E6" stroke-width="2"/>

  <!-- ground -->
  <path d="M20 268 Q190 282 360 268" stroke="#DCE1E6" stroke-width="2" fill="none"/>

  <!-- sparkles near the raised hand -->
  <path d="M258 36 L262 46 L272 50 L262 54 L258 64 L254 54 L244 50 L254 46 Z" fill="#FFC94D"/>
  <path d="M292 100 L295 107 L302 110 L295 113 L292 120 L289 113 L282 110 L289 107 Z" fill="#FFC94D"/>
  <path d="M232 64 L234 69 L239 71 L234 73 L232 78 L230 73 L225 71 L230 69 Z" fill="#FFC94D"/>

  <!-- shout bubble -->
  <polygon points="300.0,9.0 290.1,27.7 270.4,19.8 274.9,40.5 254.7,47.0 271.4,60.0 260.2,78.0 281.4,77.2 284.3,98.2 300.0,84.0 315.7,98.2 318.6,77.2 339.8,78.0 328.6,60.0 345.3,47.0 325.1,40.5 329.6,19.8 309.9,27.7"
    fill="#FFFFFF" stroke="#D1495B" stroke-width="3" stroke-linejoin="round"/>
  <text x="300" y="66" font-family="Fraunces, serif" font-weight="700" font-size="26" text-anchor="middle" fill="#D1495B">Me!</text>

  <!-- hair (a larger circle peeking out from behind the face as a cap) -->
  <circle cx="170" cy="106" r="66" fill="#3D5068"/>

  <!-- head -->
  <circle cx="170" cy="152" r="62" fill="#FBD9A6" stroke="#1F2A38" stroke-width="3"/>

  <!-- body -->
  <path d="M126 252 C121 206 129 176 170 176 C211 176 219 206 214 252 Z" fill="#E0863A"/>

  <!-- legs, playful stance -->
  <path d="M148 249 L141 288" stroke="#3D5068" stroke-width="15" stroke-linecap="round"/>
  <path d="M192 249 L203 288" stroke="#3D5068" stroke-width="15" stroke-linecap="round"/>
  <ellipse cx="139" cy="291" rx="13" ry="7" fill="#1F2A38"/>
  <ellipse cx="205" cy="291" rx="13" ry="7" fill="#1F2A38"/>

  <!-- raised arm, drawn on top so it reaches up clearly in front of the hair -->
  <path d="M205 190 Q230 150 233 96" fill="none" stroke="#E0863A" stroke-width="15" stroke-linecap="round"/>
  <circle cx="233" cy="90" r="15" fill="#FBD9A6" stroke="#1F2A38" stroke-width="2.5"/>
  <path d="M233 76 L233 66" stroke="#1F2A38" stroke-width="3" stroke-linecap="round"/>
  <path d="M244 80 L252 72" stroke="#1F2A38" stroke-width="3" stroke-linecap="round"/>
  <path d="M222 80 L214 72" stroke="#1F2A38" stroke-width="3" stroke-linecap="round"/>

  <!-- other arm, relaxed and out for balance -->
  <path d="M135 190 Q108 206 113 232" fill="none" stroke="#E0863A" stroke-width="15" stroke-linecap="round"/>
  <circle cx="113" cy="236" r="13" fill="#FBD9A6" stroke="#1F2A38" stroke-width="2.5"/>

  <!-- rosy cheeks -->
  <ellipse cx="130" cy="174" rx="14" ry="9" fill="#F6A6A6" opacity="0.75"/>
  <ellipse cx="210" cy="174" rx="14" ry="9" fill="#F6A6A6" opacity="0.75"/>

  <!-- eyebrows, excited -->
  <path d="M133 129 L156 123" stroke="#1F2A38" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M207 129 L184 123" stroke="#1F2A38" stroke-width="3.5" stroke-linecap="round"/>

  <!-- eyes, big and sparkly -->
  <circle cx="148" cy="154" r="11" fill="#1F2A38"/>
  <circle cx="152" cy="150" r="3.2" fill="#FFFFFF"/>
  <circle cx="192" cy="154" r="11" fill="#1F2A38"/>
  <circle cx="196" cy="150" r="3.2" fill="#FFFFFF"/>

  <!-- open, shouting mouth -->
  <ellipse cx="170" cy="184" rx="18" ry="22" fill="#8C3B2E" stroke="#1F2A38" stroke-width="3"/>
  <rect x="158" y="171" width="24" height="7" rx="3" fill="#FFFFFF"/>
</svg>
