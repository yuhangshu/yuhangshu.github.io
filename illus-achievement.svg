<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A cartoon child standing on the tallest of three rising steps, with a star overhead, and a smaller child looking up from the ground, next to a stack of books" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="398" height="258" rx="20" fill="#FFFFFF" stroke="#DCE1E6" stroke-width="2"/>

  <!-- ground -->
  <line x1="30" y1="226" x2="370" y2="226" stroke="#DCE1E6" stroke-width="2"/>

  <!-- ascending steps -->
  <rect x="120" y="186" width="58" height="40" rx="8" fill="#E7EAEE"/>
  <rect x="188" y="156" width="58" height="70" rx="8" fill="#7E93A8"/>
  <rect x="256" y="120" width="58" height="106" rx="8" fill="#3D5068"/>

  <!-- books stack, bottom left -->
  <rect x="46" y="206" width="46" height="10" rx="2" fill="#28394A"/>
  <rect x="50" y="195" width="42" height="10" rx="2" fill="#E0863A"/>
  <rect x="46" y="184" width="46" height="10" rx="2" fill="#5C6B7A"/>

  <!-- small kid at the base, looking up -->
  <g>
    <rect x="90" y="150" width="40" height="42" rx="14" fill="#5C6B7A"/>
    <circle cx="110" cy="128" r="21" fill="#F3DFC4" stroke="#1F2A38" stroke-width="2"/>
    <path d="M92 122 Q110 100 128 122 Q118 112 110 112 Q102 112 92 122 Z" fill="#1F2A38"/>
    <circle cx="103" cy="130" r="2.2" fill="#1F2A38"/>
    <circle cx="117" cy="130" r="2.2" fill="#1F2A38"/>
    <path d="M104 138 Q110 141 116 138" fill="none" stroke="#1F2A38" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- kid on top step, arms up, star above -->
  <g>
    <rect x="256" y="70" width="46" height="50" rx="16" fill="#3D5068"/>
    <circle cx="279" cy="42" r="25" fill="#F3DFC4" stroke="#1F2A38" stroke-width="2.5"/>
    <path d="M256 34 Q279 8 302 34 Q290 22 279 22 Q268 22 256 34 Z" fill="#1F2A38"/>
    <circle cx="271" cy="44" r="2.6" fill="#1F2A38"/>
    <circle cx="287" cy="44" r="2.6" fill="#1F2A38"/>
    <path d="M269 54 Q279 62 289 54" fill="none" stroke="#1F2A38" stroke-width="2.2" stroke-linecap="round"/>
    <!-- raised arms -->
    <path d="M258 78 Q236 58 234 34" fill="none" stroke="#3D5068" stroke-width="9" stroke-linecap="round"/>
    <path d="M300 78 Q322 58 324 34" fill="none" stroke="#3D5068" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- star above the top kid -->
  <path d="M279 4 L283.5 15 L296 16 L286.5 24 L289.5 36 L279 29 L268.5 36 L271.5 24 L262 16 L274.5 15 Z" fill="#E0863A" stroke="#28394A" stroke-width="1"/>
</svg>
