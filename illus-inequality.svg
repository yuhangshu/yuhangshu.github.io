<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two cartoon children with an unequal number of tokens in front of them" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="398" height="258" rx="20" fill="#FFFFFF" stroke="#DCE1E6" stroke-width="2"/>

  <!-- ground -->
  <line x1="36" y1="216" x2="364" y2="216" stroke="#DCE1E6" stroke-width="2"/>

  <!-- Kid A: left, more tokens, smiling -->
  <g>
    <rect x="72" y="140" width="66" height="68" rx="20" fill="#3D5068"/>
    <circle cx="105" cy="106" r="33" fill="#F3DFC4" stroke="#1F2A38" stroke-width="2.5"/>
    <path d="M76 92 Q105 58 134 92 Q120 78 105 78 Q90 78 76 92 Z" fill="#1F2A38"/>
    <circle cx="94" cy="108" r="3.4" fill="#1F2A38"/>
    <circle cx="118" cy="108" r="3.4" fill="#1F2A38"/>
    <path d="M92 120 Q105 130 118 120" fill="none" stroke="#1F2A38" stroke-width="2.5" stroke-linecap="round"/>
    <!-- arms -->
    <path d="M74 158 Q54 172 58 194" fill="none" stroke="#3D5068" stroke-width="10" stroke-linecap="round"/>
    <path d="M136 158 Q156 172 152 194" fill="none" stroke="#3D5068" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- tokens pile for Kid A (5) -->
  <circle cx="52" cy="205" r="10" fill="#E0863A" stroke="#28394A" stroke-width="1.5"/>
  <circle cx="70" cy="210" r="10" fill="#E0863A" stroke="#28394A" stroke-width="1.5"/>
  <circle cx="88" cy="206" r="10" fill="#E0863A" stroke="#28394A" stroke-width="1.5"/>
  <circle cx="60" cy="192" r="10" fill="#E0863A" stroke="#28394A" stroke-width="1.5"/>
  <circle cx="98" cy="194" r="10" fill="#E0863A" stroke="#28394A" stroke-width="1.5"/>

  <!-- Kid B: right, fewer tokens, uncertain expression -->
  <g>
    <rect x="262" y="140" width="66" height="68" rx="20" fill="#5C6B7A"/>
    <circle cx="295" cy="106" r="33" fill="#F3DFC4" stroke="#1F2A38" stroke-width="2.5"/>
    <path d="M264 96 Q280 74 295 78 Q312 74 326 96 Q312 84 295 86 Q280 84 264 96 Z" fill="#1F2A38"/>
    <circle cx="284" cy="108" r="3.4" fill="#1F2A38"/>
    <circle cx="308" cy="108" r="3.4" fill="#1F2A38"/>
    <path d="M283 100 L292 97" stroke="#1F2A38" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M285 122 Q295 118 306 122" fill="none" stroke="#1F2A38" stroke-width="2.5" stroke-linecap="round"/>
    <!-- arms -->
    <path d="M264 158 Q244 172 248 194" fill="none" stroke="#5C6B7A" stroke-width="10" stroke-linecap="round"/>
    <path d="M326 158 Q346 172 342 194" fill="none" stroke="#5C6B7A" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- tokens pile for Kid B (2) -->
  <circle cx="280" cy="207" r="10" fill="#E0863A" stroke="#28394A" stroke-width="1.5"/>
  <circle cx="300" cy="204" r="10" fill="#E0863A" stroke="#28394A" stroke-width="1.5"/>

  <!-- small thought marks over Kid B -->
  <circle cx="330" cy="72" r="3" fill="#DCE1E6"/>
  <circle cx="338" cy="60" r="4" fill="#DCE1E6"/>
  <circle cx="349" cy="44" r="14" fill="#FAFBF9" stroke="#DCE1E6" stroke-width="2"/>
  <text x="349" y="49" font-family="IBM Plex Mono, monospace" font-size="15" text-anchor="middle" fill="#5C6B7A">?</text>
</svg>
